name: fitness_timer
description: "Simple Home Workout Timer — interval training app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local DB
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.0

  # Screen wake
  wakelock_plus: ^1.2.5

  # Haptic
  vibration: ^2.0.0

  # TTS
  flutter_tts: ^4.0.2

  # Audio
  audio_session: ^0.1.21
  just_audio: ^0.9.40

  # Notifications & foreground service
  flutter_local_notifications: ^17.2.2
  flutter_foreground_task: ^8.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0
  fake_async: ^1.3.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/
